name: Tests 15 sprint

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

env:
  DIR_TESTS: /tmp/tests-migrate-db
  REP_TESTS: https://github.com/Yandex-Practicum/tests-migrate-db.git

jobs:
  test_endpoints:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Set up GitHub Actions
        uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Get testing lib
        run: set -eu && git clone --depth 1 $REP_TESTS $DIR_TESTS

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            sleep 2
          done
        env:
          PGPASSWORD: postgres

      - name: Setup database
        run: |
          psql -h localhost -U postgres -d project_db -f backend/test/prac.init.sql
          psql -h localhost -U postgres -d project_db -f backend/test/prac.films.sql
          psql -h localhost -U postgres -d project_db -f backend/test/prac.shedules.sql
        env:
          PGPASSWORD: postgres

      - name: Create .env file
        run: |
          echo "DATABASE_DRIVER=postgres" > backend/.env
          echo "DATABASE_HOST=localhost" >> backend/.env
          echo "DATABASE_PORT=5432" >> backend/.env
          echo "DATABASE_USERNAME=postgres" >> backend/.env
          echo "DATABASE_PASSWORD=postgres" >> backend/.env
          echo "DATABASE_NAME=project_db" >> backend/.env
          echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/project_db" >> backend/.env
          echo "SYNCHRONIZE=false" >> backend/.env

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Start project
        run: bash $DIR_TESTS/bin/start_project.sh

      - name: Run tests
        run: bash $DIR_TESTS/bin/endpoints.sh