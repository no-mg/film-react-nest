version: "3.8"

services:
  database:
    image: postgres:15-alpine
    container_name: film_db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-films}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: film_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "8080:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - app-network
    depends_on:
      - database

  backend:
    build:
      context: ./backend
    image: ghcr.io/no-mg/film-backend:latest
    container_name: film_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_HOST=database
      - LOGGER_TYPE=json
    depends_on:
      - database
    networks:
      - app-network

  frontend:
    build: 
      context: ./frontend
    image: ghcr.io/no-mg/film-frontend:latest
    container_name: film_frontend
    restart: always
    volumes:
      - frontend-dist:/app/dist
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
    image: ghcr.io/no-mg/film-nginx:latest
    container_name: film_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  postgres-data:
  pgadmin-data:
  frontend-dist:

networks:
  app-network:
    driver: bridge
